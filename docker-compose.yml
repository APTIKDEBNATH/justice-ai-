version: '3.8'

services:
  justice-ai:
    build: .
    container_name: justice_ai_app
    ports:
      - "3000:3000"  # Frontend Web Client
      - "5000:5000"  # Backend REST API
      - "8501:8501"  # Streamlit Advisory Dashboard
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=5000
    restart: unless-stopped
